.splash-screen {
    position: fixed;
    inset: 0;
    z-index: 20000;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(circle at top left, rgba(59,130,246,0.18), transparent 28%),
        radial-gradient(circle at top right, rgba(14,165,233,0.14), transparent 24%),
        linear-gradient(180deg, #f8fbff 0%, #eef4ff 100%);
    transition: opacity 0.6s ease, visibility 0.6s ease;
}

.splash-screen.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: scale(0.98);
}

.splash-content {
    width: 100%;
    max-width: 360px;
    margin: 0 auto;
    padding: 24px 20px;
    text-align: center;

    display: grid;
    justify-items: center;
    row-gap: 12px;

    animation: splashEntrance 0.9s ease-out;
}

.splash-icon {
    width: 120px;
    height: 120px;
    margin-bottom: 12px;

    display: flex;
    align-items: center;
    justify-content: center;
        animation:
            splashSoftFloat 0.8s ease-out,
            splashFloat 1.6s ease-in-out infinite;
}

.splash-icon img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 20px;   /* 앱 아이콘 느낌 */
}

.splash-title {
    display: block;
    width: 100%;
    margin: 0;

    font-size: 28px !important;   /* ⭐ 강제 복구 */
    font-weight: 800;
    color: #0f172a;
    letter-spacing: -0.5px;

    text-align: center;
    animation: splashSoftFloat 0.95s ease-out;
}

.splash-subtitle {
    display: block;
    width: 100%;
    margin: 0;

    font-size: 15px;
    color: #64748b;
    letter-spacing: -0.2px;

    text-align: center;
    animation: splashSoftFloat 1.1s ease-out;
}

@keyframes splashFloat {
    0% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
    100% { transform: translateY(0); }
}

@keyframes splashEntrance {
    0% {
        opacity: 0;
        transform: translateY(14px) scale(0.96);
    }
    100% {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@keyframes splashSoftFloat {
    0% {
        opacity: 0;
        transform: translateY(10px);
    }
    100% {
        opacity: 1;
        transform: translateY(0);
    }
}

.splash-loader {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
}

.splash-loader span {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #2563eb;
    opacity: 0.4;
    animation: splashDot 1.2s infinite ease-in-out;
}

.splash-loader span:nth-child(2) {
    animation-delay: 0.2s;
}

.splash-loader span:nth-child(3) {
    animation-delay: 0.4s;
}

@keyframes splashDot {
    0%, 80%, 100% {
        transform: scale(0.8);
        opacity: 0.3;
    }
    40% {
        transform: scale(1.2);

// 동 조회 함수
async function loadDongs(region) {

    if (!region) {
        dongSelect.innerHTML = '<option value="">동 선택</option>';
        return;
    }

    // ✅ 캐시 있으면 바로 사용
    if (dongCache[region]) {
        renderDongs(dongCache[region]);
        return;
    }

    dongSelect.innerHTML = '<option value="">🔍 동 검색중...</option>';

    try {
        const res = await fetch(`/dongs?region=${encodeURIComponent(region)}`);
        const data = await res.json();

        const dongs = data["동목록"] || [];

        // ✅ 캐시에 저장
        dongCache[region] = dongs;

        renderDongs(dongs);

    } catch (e) {
        dongSelect.innerHTML = '<option value="">동 조회 실패</option>';
        console.error(e);
    }
}

function renderDongs(dongs) {
    dongSelect.innerHTML = '<option value="">동 선택</option>';

    if (dongs.length === 0) {
        dongSelect.innerHTML = '<option value="">동 없음</option>';
        return;
    }

    dongs.forEach(dong => {
        const option = document.createElement("option");
        option.value = dong;
        option.textContent = dong;
        dongSelect.appendChild(option);
    });
}

// 🔥 아파트 가져오기 (캐시 포함)
function fetchApts(region, keyword = "") {
    const selectedDong = document.getElementById("dongSelect").value;
    const cacheKey = region + "_" + selectedDong;

    if (!keyword && !selectedDong) {
        document.getElementById("aptList").innerHTML = "";
        return;
    }

    document.getElementById("aptList").innerHTML = "<div class='item loading-text'>🔍 아파트 검색중...</div>";

    if (aptCache[cacheKey]) {
        filterApts(aptCache[cacheKey], keyword);
        return;
    }

    let url = "/apts?region=" + encodeURIComponent(region) + "&keyword=";
    if (selectedDong) {
        url += "&dong=" + encodeURIComponent(selectedDong);
    }

    fetch(url)
        .then(res => res.json())
        .then(data => {
            aptCache[cacheKey] = data.검색결과 || [];
            filterApts(aptCache[cacheKey], keyword);
        })
        .catch(err => {
            console.log("❌ 아파트 조회 에러:", err);
            document.getElementById("aptList").innerHTML = "<div class='item'>조회 오류</div>";
        });
}



// 🔥 필터 (프론트에서 처리)
function filterApts(list, keyword) {
    const listEl = document.getElementById("aptList");
    listEl.innerHTML = "";

    const keywordNorm = (keyword || "").replace(/\s/g, "").toLowerCase();
    const selectedDong = document.getElementById("dongSelect").value;

    let filtered = list;

    if (selectedDong) {
        filtered = filtered.filter(apt => (apt.dong || "") === selectedDong);
    }

    if (keywordNorm) {
        filtered = filtered.filter(apt =>
            (apt.name || "").replace(/\s/g, "").toLowerCase().includes(keywordNorm)
        );
    }

    if (filtered.length === 0) {
        listEl.innerHTML = "<div class='item'>검색 결과 없음</div>";
        return;
    }

    filtered.slice(0, 20).forEach(apt => {
        const aptName = apt.name || "";
        const aptDong = apt.dong || "";

        const div = document.createElement("div");
        div.className = "item";
        div.innerText = aptDong ? `${aptName} (${aptDong})` : aptName;



        div.onclick = function () {
            document.getElementById("aptInput").value = aptName;
            listEl.innerHTML = "";

            resetAfterAptChange();

            const region = document.getElementById("regionInput").value;
            const sizeSelect = document.getElementById("sizeSelect");
            sizeSelect.innerHTML = '<option value="">🔍 평형 검색중...</option>';

            fetch("/sizes?region="
                + encodeURIComponent(region)
                + "&apt_name="
                + encodeURIComponent(aptName))
                .then(res => res.json())
                .then(data => {
                showSizes(data);
            })
            .catch(err => {
                console.log("❌ 평형 조회 에러:", err);
                sizeSelect.innerHTML = '<option value="">평형 조회 오류</option>';
            });
};



        listEl.appendChild(div);
    });
}


// 🔥 평형 로드
function loadSizes() {

    const region = document.getElementById("regionInput").value;
    const apt = document.getElementById("aptInput").value;

    if (!region || !apt) return;

    fetch(
        "/sizes?region=" +
        encodeURIComponent(region) +
        "&apt_name=" +
        encodeURIComponent(apt)
    )
    .then(res => res.json())
    .then(data => {

        const select = document.getElementById("sizeSelect");
        select.innerHTML = "";

        const defaultOption = document.createElement("option");
        defaultOption.text = "평형 선택";
        defaultOption.value = "";
        select.appendChild(defaultOption);

        const sizes = data["평형목록"];

        if (!sizes) return;

        sizes.forEach(size => {
            const option = document.createElement("option");
            option.value = size;
            option.text = size + "㎡";
            select.appendChild(option);
        });
    });
}

function closeModal() {
    const modal = document.getElementById("reportModal");
    if (modal) {
        modal.style.display = "none";
    }

    document.body.classList.remove("modal-open");

    const params = new URLSearchParams(window.location.search);

    const hasSharedQuery =
        params.has("region") ||
        params.has("apt") ||
        params.has("size") ||
        params.has("price");

    if (!hasSharedQuery) return;

    const regionInput = document.getElementById("regionInput");
    const aptInput = document.getElementById("aptInput");
    const userPriceInput = document.getElementById("userPriceInput");
    const dongSelect = document.getElementById("dongSelect");
    const sizeSelect = document.getElementById("sizeSelect");
    const regionList = document.getElementById("regionList");
    const aptList = document.getElementById("aptList");
    const resultBox = document.getElementById("resultBox");

    if (regionInput) regionInput.value = "";
    if (aptInput) aptInput.value = "";
    if (userPriceInput) userPriceInput.value = "";

    if (dongSelect) dongSelect.innerHTML = '<option value="">동 선택</option>';
    if (sizeSelect) sizeSelect.innerHTML = '<option value="">평형 선택</option>';
    if (regionList) regionList.innerHTML = "";
    if (aptList) aptList.innerHTML = "";
    if (resultBox) resultBox.innerHTML = "";

    window.history.replaceState({}, document.title, window.location.pathname);
}

        fallbackCopy(text);
    }

// 🔥 fallback 복사 함수
function fallbackCopy(text) {
    const textarea = document.createElement("textarea");
    textarea.value = text;
    document.body.appendChild(textarea);
    textarea.select();

    try {
        document.execCommand("copy");
        alert("링크가 복사되었습니다!");
    } catch (err) {
        alert("복사 실패 😢");
    }

    document.body.removeChild(textarea);
}
